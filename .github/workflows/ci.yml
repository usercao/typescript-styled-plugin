name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .github/.node-version
          package-manager-cache: false
      - run: corepack enable
      - name: Find Yarn cache
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn install --immutable
      - name: Formatting
        run: yarn format:check
      - name: Linting
        run: yarn lint
  compile:
    name: Compile and Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .github/.node-version
          package-manager-cache: false
      - run: corepack enable
      - name: Find Yarn cache
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn install --immutable
      - name: Compiling
        run: yarn compile
      - name: Type checking
        run: yarn typecheck
      - name: Package API and runtime
        run: yarn test:package-api
      - name: Package contents
        run: mkdir -p package-artifact && npm pack --pack-destination package-artifact
      - name: Upload packed package
        uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          path: package-artifact/*.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: lib
          path: lib
          if-no-files-found: error
          retention-days: 1
  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .github/.node-version
          package-manager-cache: false
      - run: corepack enable
      - name: Find Yarn cache
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn install --immutable
      - name: Compiling
        run: yarn compile
      - run: yarn test:unit
  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-24.04
    needs: compile
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node 22.12 / TypeScript 6.0.2
            node-version: 22.12.0
            typescript-package: typescript-minimum
            test-package-runtime: true
          - name: Node 22.12 / latest supported TypeScript 6.x
            node-version: 22.12.0
            typescript-package: typescript-current
          - name: Node 24 / latest supported TypeScript 6.x
            node-version: 24.21.0
            typescript-package: typescript-current
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: corepack enable
      - name: Find Yarn cache
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn install --immutable
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: lib
          path: lib
      - name: Download packed package
        if: matrix.test-package-runtime
        uses: actions/download-artifact@v8
        with:
          name: package-tarball
          path: package-artifact
      - name: Test packed package runtime
        if: matrix.test-package-runtime
        run: node --experimental-strip-types test/package-api/runtime.ts package-artifact/*.tgz
      - name: Run tsserver scenarios
        run: yarn test:e2e:run
        env:
          TSSERVER_TYPESCRIPT_PACKAGE: ${{ matrix.typescript-package }}
