on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
name: Continuous Integration

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .github/.node-version
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - name: Formatting
        run: yarn format:check
      - name: Linting
        run: yarn lint
  compile:
    name: Compile and Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .github/.node-version
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - name: Compiling
        run: yarn compile
      - name: Type checking
        run: yarn typecheck
      - name: Package API and runtime
        run: yarn test:package-api
      - name: Package contents
        run: npm pack --dry-run
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: lib
          path: lib
          if-no-files-found: error
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .github/.node-version
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - name: Compiling
        run: yarn compile
      - run: yarn test:unit
  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node 22.12 / TypeScript 6.0.2
            node-version: 22.12.0
            typescript-package: typescript-minimum
          - name: Node 22.12 / TypeScript current
            node-version: 22.12.0
            typescript-package: typescript-current
          - name: Node 24 / TypeScript current
            node-version: 24.21.0
            typescript-package: typescript-current
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - name: Download build output
        uses: actions/download-artifact@v5
        with:
          name: lib
          path: lib
      - name: Run tsserver scenarios
        run: yarn test:e2e:run
        env:
          TSSERVER_TYPESCRIPT_PACKAGE: ${{ matrix.typescript-package }}
